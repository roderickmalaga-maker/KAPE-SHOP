<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Accounts - ARL Coffee Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">☕</div>
                <h2>ARL Coffee Shop</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="admin.html#cashier-approvals" class="nav-item"><span class="nav-icon">✅</span><span>Cashier Approvals</span></a>
                <a href="accounts.html" class="nav-item active admin-only"><span class="nav-icon">👥</span><span>All Accounts</span></a>
                <a href="pos.html" class="nav-item"><span class="nav-icon">🛒</span><span>Point of Sale</span></a>
                <a href="products.html" class="nav-item"><span class="nav-icon">☕</span><span>Products</span></a>
                <a href="orders.html" class="nav-item"><span class="nav-icon">📋</span><span>Orders</span></a>
                <a href="inventory.html" class="nav-item"><span class="nav-icon">📦</span><span>Inventory</span></a>
                <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span><span>Sales Reports</span></a>
                <a href="settings.html" class="nav-item admin-only"><span class="nav-icon">⚙️</span><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">Loading...</div>
                    </div>
                </div>
                <button onclick="Auth.logout()" class="btn btn-logout">🚪 Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="main-header">
                <h1>User Account Management</h1>
            </header>
            
            <div class="card">
                <div class="card-header">
                    <h2>Registered Users</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Full Name</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Date Registered</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/accounts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.DB.initDB();
            const user = window.Auth.requireAuth('Administrator');
            if (!user) return;
            document.getElementById('userName').textContent = user.fullName;
            document.getElementById('userRole').textContent = user.role;
            await loadAccounts();
        });
    </script>
</body>
</html>
