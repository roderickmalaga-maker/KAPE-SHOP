<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order - ARL Coffee Shop</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/customer-menu.css"></head><body><main class="main-content" style="max-width:900px;margin:35px auto;padding:20px"><header class="main-header"><h1>Track Your Order</h1><a href="customer-products.html">Back to Menu</a></header><section class="card"><div class="card-body"><p>Enter your order number and the contact number used at checkout.</p><div class="guest-checkout"><label>Order Number</label><input id="trackNumber" placeholder="ARL-12345678"><label>Contact Number</label><input id="trackPhone" placeholder="09XXXXXXXXX"><button class="btn btn-primary" onclick="trackOrder()">Track Order</button></div><div id="trackingResult"></div></div></section><section class="card" style="margin-top:20px"><div class="card-body"><h2>Your orders on this browser</h2><div id="savedOrders">No saved orders yet.</div></div></section></main><script src="js/database.js"></script><script src="js/auth.js"></script><script>
async function trackOrder(){const no=document.getElementById('trackNumber').value.trim(),phone=document.getElementById('trackPhone').value.trim(),out=document.getElementById('trackingResult');out.textContent='Searching...';try{const orders=await DB.getAllRecords('Orders');const o=orders.find(x=>x.orderNumber===no&&(x.guestContact===phone||x.contactNumber===phone));if(!o){out.textContent='No matching order found. Check the order number and contact number.';return;}const items=(await DB.getAllRecords('OrderItems')).filter(i=>i.orderId===o.orderId);out.innerHTML='<h3>Order '+o.orderNumber+'</h3><p><b>Status:</b> '+o.status+'</p><p><b>Order type:</b> '+(o.orderType||'N/A')+'</p><p><b>Total:</b> ₱'+Number(o.totalAmount||0).toFixed(2)+'</p><ul>'+items.map(i=>'<li>'+String(i.productName||i.name||'Item')+' × '+i.quantity+'</li>').join('')+'</ul>';}catch(e){out.textContent='Unable to look up order.';}}
async function init(){await DB.initDB();await DB.initializeSampleData();const saved=JSON.parse(localStorage.getItem('arlGuestOrders')||'[]');document.getElementById('savedOrders').innerHTML=saved.length?saved.map(x=>'<p>'+x.orderNumber+' · '+x.phone+'</p>').join(''):'No saved orders yet.';const n=new URLSearchParams(location.search).get('order');if(n){document.getElementById('trackNumber').value=n;const x=saved.find(a=>a.orderNumber===n);if(x){document.getElementById('trackPhone').value=x.phone;trackOrder();}}}document.addEventListener('DOMContentLoaded',init);
</script></body></html>
