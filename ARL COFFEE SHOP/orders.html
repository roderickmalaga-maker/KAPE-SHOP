<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - ARL COFFEE SHOP</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">☕</div>
                <h2>ARL Coffee Shop</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="admin.html#cashier-approvals" class="nav-item"><span class="nav-icon">✅</span><span>Cashier Approvals</span></a>
                <a href="accounts.html" class="nav-item"><span class="nav-icon">👥</span><span>All Accounts</span></a>
                <a href="pos.html" class="nav-item"><span class="nav-icon">🛒</span><span>Point of Sale</span></a>
                <a href="products.html" class="nav-item"><span class="nav-icon">☕</span><span>Products</span></a>
                <a href="orders.html" class="nav-item active"><span class="nav-icon">📋</span><span>Orders</span></a>
                <a href="customers.html" class="nav-item"><span class="nav-icon">👤</span><span>Customers</span></a>
                <a href="inventory.html" class="nav-item"><span class="nav-icon">📦</span><span>Inventory</span></a>
                <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span><span>Sales Reports</span></a>
                <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">Loading...</div>
                    </div>
                </div>
                <button onclick="Auth.logout()" class="btn btn-logout">🚪 Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="main-header">
                <h1>Order Management</h1>
                <a href="pos.html" class="btn btn-primary">+ New Order</a>
            </header>
            
            <div class="card" style="margin-bottom: 18px;">
                <div class="card-body" style="display: flex; gap: 14px; flex-wrap: wrap; align-items: center;">
                    <select id="statusFilter" onchange="loadOrders()" style="padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--border-color); background: var(--primary-black); color: var(--white); font-family: Inter, sans-serif;">
                        <option value="all">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Preparing">Preparing</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>Orders</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Order #</th>
                                    <th>Date</th>
                                    <th>Items</th>
                                    <th>Total</th>
                                    <th>Payment</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody">
                                <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders-list.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.DB.initDB();
            await window.DB.initializeSampleData();
            const user = window.Auth.requireAuth(['Administrator', 'Cashier']);
            if (!user) return;
            document.getElementById('userName').textContent = user.fullName;
            document.getElementById('userRole').textContent = user.role;
            await loadOrders();
        });
    </script>
</body>
</html>
