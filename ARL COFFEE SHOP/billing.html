<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - ARL Coffee Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">☕</div>
                <h2>ARL Coffee Shop</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item admin-only"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="cashier-dashboard.html" class="nav-item cashier-only"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="pos.html" class="nav-item"><span class="nav-icon">🛒</span><span>Point of Sale</span></a>
                <a href="orders.html" class="nav-item active"><span class="nav-icon">📋</span><span>Orders</span></a>
                <a href="customers.html" class="nav-item"><span class="nav-icon">👤</span><span>Customers</span></a>
                <a href="products.html" class="nav-item admin-only"><span class="nav-icon">☕</span><span>Products</span></a>
                <a href="inventory.html" class="nav-item admin-only"><span class="nav-icon">📦</span><span>Inventory</span></a>
                <a href="reports.html" class="nav-item admin-only"><span class="nav-icon">📈</span><span>Sales Reports</span></a>
                <a href="accounts.html" class="nav-item admin-only"><span class="nav-icon">👥</span><span>Accounts</span></a>
                <a href="settings.html" class="nav-item admin-only"><span class="nav-icon">⚙️</span><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">Loading...</div>
                    </div>
                </div>
                <button onclick="Auth.logout()" class="btn btn-logout">🚪 Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="main-header">
                <h1>Billing & Receipt</h1>
                <div>
                    <button onclick="window.print()" class="btn btn-primary">🖨️ Print Receipt</button>
                    <a href="pos.html" class="btn" style="background-color: var(--charcoal); color: var(--warm-beige); border: 1px solid var(--border-color);">New Order</a>
                </div>
            </header>
            
            <div class="card" style="max-width: 420px; margin: 0 auto; background: var(--white); color: var(--dark-brown);">
                <div class="card-body" id="receipt" style="font-family: 'Courier New', monospace; font-size: 13px; color: #333;">
                    <div style="text-align: center; margin-bottom: 15px;">
                        <h2 style="font-size: 18px; margin-bottom: 5px; color: #333;">ARL COFFEE SHOP</h2>
                        <p style="font-size: 11px;">123 Coffee Street, City</p>
                        <p style="font-size: 11px;">Tel: (000) 000-0000</p>
                    </div>
                    <hr style="border: 1px dashed #666; margin: 10px 0;">
                    <div id="receiptInfo"></div>
                    <hr style="border: 1px dashed #666; margin: 10px 0;">
                    <div id="receiptItems"></div>
                    <hr style="border: 1px dashed #666; margin: 10px 0;">
                    <div id="receiptTotals"></div>
                    <hr style="border: 1px dashed #666; margin: 10px 0;">
                    <div style="text-align: center; margin-top: 15px; font-size: 11px;">
                        <p>Thank you for your purchase!</p>
                        <p>Please come again</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/billing.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.DB.initDB();
            const user = window.Auth.requireAuth(['Administrator', 'Cashier']);
            if (!user) return;
            document.getElementById('userName').textContent = user.fullName;
            document.getElementById('userRole').textContent = user.role;
            if (user.role !== 'Administrator') {
                document.querySelectorAll('.admin-only').forEach(item => item.style.display = 'none');
            } else {
                document.querySelectorAll('.cashier-only').forEach(item => item.style.display = 'none');
            }
            await loadReceipt();
        });
    </script>
</body>
</html>
