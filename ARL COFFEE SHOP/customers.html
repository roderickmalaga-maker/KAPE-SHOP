<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - ARL COFFEE SHOP</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">☕</div>
                <h2>ARL Coffee Shop</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="admin.html#cashier-approvals" class="nav-item"><span class="nav-icon">✅</span><span>Cashier Approvals</span></a>
                <a href="accounts.html" class="nav-item"><span class="nav-icon">👥</span><span>All Accounts</span></a>
                <a href="pos.html" class="nav-item"><span class="nav-icon">🛒</span><span>Point of Sale</span></a>
                <a href="products.html" class="nav-item"><span class="nav-icon">☕</span><span>Products</span></a>
                <a href="orders.html" class="nav-item"><span class="nav-icon">📋</span><span>Orders</span></a>
                <a href="customers.html" class="nav-item active"><span class="nav-icon">👤</span><span>Customers</span></a>
                <a href="inventory.html" class="nav-item"><span class="nav-icon">📦</span><span>Inventory</span></a>
                <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span><span>Sales Reports</span></a>
                <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">Loading...</div>
                    </div>
                </div>
                <button onclick="Auth.logout()" class="btn btn-logout">🚪 Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="main-header">
                <h1>Customer Management</h1>
                <button onclick="showAddCustomer()" class="btn btn-primary">+ Add Customer</button>
            </header>
            
            <div class="card">
                <div class="card-header">
                    <h2>Customers</h2>
                </div>
                <div class="card-body">
                    <div style="margin-bottom: 16px;">
                        <input type="text" id="searchCustomer" placeholder="Search customers..." oninput="filterCustomers()" style="width: 100%; max-width: 320px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--primary-black); color: var(--white); font-family: Inter, sans-serif;">
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Contact</th>
                                    <th>Email</th>
                                    <th>Total Orders</th>
                                    <th>Total Spent</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="customersTableBody">
                                <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Customer Modal -->
    <div id="customerModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: linear-gradient(145deg, var(--secondary-black), var(--charcoal)); border: 1px solid var(--border-color); border-radius: 12px; padding: 28px; width: 100%; max-width: 420px; margin: 20px;">
            <h2 id="modalTitle" style="color: var(--white); font-family: 'Playfair Display', serif; margin-bottom: 20px;">Add Customer</h2>
            <form id="customerForm" onsubmit="saveCustomer(event)">
                <input type="hidden" id="customerId">
                <div class="form-group">
                    <label for="customerName">Full Name</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label for="customerContact">Contact Number</label>
                    <input type="tel" id="customerContact" required>
                </div>
                <div class="form-group">
                    <label for="customerEmail">Email (Optional)</label>
                    <input type="email" id="customerEmail">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save</button>
                    <button type="button" onclick="closeCustomerModal()" class="btn" style="flex: 1; background: var(--charcoal); color: var(--warm-beige); border: 1px solid var(--border-color);">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/customers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.DB.initDB();
            await window.DB.initializeSampleData();
            const user = window.Auth.requireAuth(['Administrator', 'Cashier']);
            if (!user) return;
            document.getElementById('userName').textContent = user.fullName;
            document.getElementById('userRole').textContent = user.role;
            await loadCustomers();
        });
    </script>
</body>
</html>
