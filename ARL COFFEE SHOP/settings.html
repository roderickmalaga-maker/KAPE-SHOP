<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings - ARL Coffee Shop</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"></head><body><main class="main-content" style="max-width:760px;margin:35px auto;padding:20px"><header class="main-header"><h1>Shop Settings</h1><a href="admin.html">Back to Dashboard</a></header><section class="card"><div class="card-body"><form id="settingsForm"><label>Shop Name</label><input id="shopName" required><label>Tax Rate (%)</label><input id="taxRate" type="number" min="0" max="100" step="0.01" required><label>Currency</label><select id="currency"><option value="PHP">PHP (₱)</option></select><button class="btn btn-primary" type="submit">Save Settings</button><p id="settingsMessage"></p></form></div></section></main><script src="js/database.js"></script><script src="js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{await DB.initDB();await DB.initializeSampleData();const u=Auth.requireAuth('Administrator');if(!u)return;const all=await DB.getAllRecords('Settings');const get=k=>all.find(x=>x.key===k)?.value;shopName.value=get('shopName')||'ARL Coffee Shop';taxRate.value=get('taxRate')??12;currency.value=get('currency')||'PHP';});
settingsForm.addEventListener('submit',async e=>{e.preventDefault();for(const [key,value] of [['shopName',shopName.value.trim()],['taxRate',Number(taxRate.value)],['currency',currency.value]])await DB.updateRecord('Settings',{key,value});settingsMessage.textContent='Settings saved.';});
</script></body></html>
