<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point of Sale - ARL Coffee Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">☕</div>
                <h2>ARL Coffee Shop</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item admin-only"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="cashier-dashboard.html" class="nav-item cashier-only"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="pos.html" class="nav-item active"><span class="nav-icon">🛒</span><span>Point of Sale</span></a>
                <a href="orders.html" class="nav-item"><span class="nav-icon">📋</span><span>Orders</span></a>
                <a href="customers.html" class="nav-item"><span class="nav-icon">👤</span><span>Customers</span></a>
                <a href="products.html" class="nav-item admin-only"><span class="nav-icon">☕</span><span>Products</span></a>
                <a href="inventory.html" class="nav-item admin-only"><span class="nav-icon">📦</span><span>Inventory</span></a>
                <a href="reports.html" class="nav-item admin-only"><span class="nav-icon">📈</span><span>Sales Reports</span></a>
                <a href="accounts.html" class="nav-item admin-only"><span class="nav-icon">👥</span><span>Accounts</span></a>
                <a href="settings.html" class="nav-item admin-only"><span class="nav-icon">⚙️</span><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">Loading...</div>
                    </div>
                </div>
                <button onclick="Auth.logout()" class="btn btn-logout">🚪 Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="main-header">
                <h1>Point of Sale</h1>
            </header>
            
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                <div class="card">
                    <div class="card-header">
                        <h2>Menu</h2>
                        <select id="categoryFilter" onchange="filterProducts()" style="margin-top: 10px; padding: 10px; border-radius: 6px; background: var(--primary-black); color: var(--white); border: 1px solid var(--border-color); font-family: Inter, sans-serif;">
                            <option value="all">All Categories</option>
                        </select>
                    </div>
                    <div class="card-body">
                        <div id="productsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;">
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h2>Current Order</h2>
                    </div>
                    <div class="card-body">
                        <div style="margin-bottom: 15px;">
                            <select id="customerSelect" style="width: 100%; padding: 10px; border-radius: 6px; background: var(--primary-black); color: var(--white); border: 1px solid var(--border-color); font-family: Inter, sans-serif;">
                                <option value="">Walk-in Customer (Optional)</option>
                            </select>
                        </div>
                        
                        <div id="cartItems" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
                        </div>
                        
                        <div style="border-top: 1px solid var(--border-color); padding-top: 15px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--warm-beige);">
                                <span>Subtotal:</span>
                                <span id="subtotal">₱0.00</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; color: var(--warm-beige);">
                                <span>Discount:</span>
                                <input type="number" id="discount" value="0" min="0" onchange="calculateTotal()" style="width: 90px; padding: 6px; border-radius: 4px; background: var(--primary-black); color: var(--white); border: 1px solid var(--border-color);">
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 600; font-size: 18px; padding-top: 10px; border-top: 1px solid var(--border-color); color: var(--caramel-gold);">
                                <span>Total:</span>
                                <span id="total">₱0.00</span>
                            </div>
                            
                            <button onclick="processOrder()" class="btn btn-primary btn-block">Confirm Order</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.DB.initDB();
            await window.DB.initializeSampleData();
            const user = window.Auth.requireAuth(['Administrator', 'Cashier']);
            if (!user) return;
            document.getElementById('userName').textContent = user.fullName;
            document.getElementById('userRole').textContent = user.role;
            if (user.role !== 'Administrator') {
                document.querySelectorAll('.admin-only').forEach(item => item.style.display = 'none');
            } else {
                document.querySelectorAll('.cashier-only').forEach(item => item.style.display = 'none');
            }
            await loadPOS();
        });
    </script>
</body>
</html>
