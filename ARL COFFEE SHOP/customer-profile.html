<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - ARL Coffee Shop</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/customer-menu.css"></head><body><main class="main-content" style="max-width:760px;margin:35px auto;padding:20px"><header class="main-header"><h1>Customer Profile</h1><a href="customer-products.html">Back to Menu</a></header><section class="card"><div class="card-body" id="profileContent">Loading...</div></section></main><script src="js/database.js"></script><script src="js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{await DB.initDB();const u=Auth.checkAuth();const el=document.getElementById('profileContent');if(!u){el.innerHTML='<h2>Guest checkout</h2><p>You can order without creating an account. Your order tracking details are shown on this browser after checkout.</p><a class="btn btn-primary" href="customer-orders.html">Track an Order</a>';return;}const users=await DB.getAllRecords('Users'),me=users.find(x=>x.userId===u.userId);if(!me){el.textContent='Profile unavailable.';return;}el.innerHTML='<h2>'+String(me.fullName||'Customer')+'</h2><p>'+String(me.email||'')+'</p><p>'+String(me.contactNumber||'')+'</p><p>To update account details, contact the shop administrator.</p>';});
</script></body></html>
